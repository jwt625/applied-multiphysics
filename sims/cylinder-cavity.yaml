# H5 Cylindrical cavity eigenmodes (DevLog-001 s.8). Eval gate RF-01 (R3; Palace docs cylinder.md): PEC cylinder,
# a = 2.74 cm, d = 2a, filled with eps_r 2.08, tan d 4e-4; TM010 2.903605, TE111 2.922212, TM011 3.468149,
# TE211 4.146842, TM110 4.626474, TE011 5.000140 GHz.
schema: amp-spec/0
id: cylinder-cavity
title: Cylindrical cavity eigenmodes
description: Resonant modes of a dielectric-filled PEC cylinder; animate E and H of each mode.
params:
  a: {value: 2.74, unit: cm, description: cavity radius}
  d: {value: "2*a", description: cavity length}
geometry:
  dim: 3
  features:
    - {id: cav, type: cylinder, settings: {radius: "a", height: "d", base: {value: [0, 0, 0], unit: m}, axis: z}}
materials:
  - {id: fill, override: {eps_r: 2.08, tan_delta: 0.0004, mu_r: 1}, select: ["dom:cav"]}
physics:
  - id: rf
    type: emw
    select: ["dom:cav"]
    bcs:
      - {id: walls, type: pec, select: ["bnd:cav.side", "bnd:cav.top", "bnd:cav.bottom"]}
mesh:
  size: {hmax: "a/4"}
studies:
  - {id: eig, type: eigen, physics: [rf], settings: {nModes: 16, shift: "2.5 GHz"}}
results:
  datasets:
    - {id: sol_eig, type: solution, data: eig}
  evaluations:
    - id: ev_eig
      data: sol_eig
      items:
        - {id: f_TM010, type: global, expr: rf.f_0, unit: GHz, label: "solver index 0; degenerate pairs (m >= 1) take two indices"}
        - {id: f_TE111, type: global, expr: rf.f_1, unit: GHz}
        - {id: f_TM011, type: global, expr: rf.f_3, unit: GHz}
        - {id: f_TE211, type: global, expr: rf.f_4, unit: GHz}
        - {id: f_TM110, type: global, expr: rf.f_8, unit: GHz}
        - {id: Q_d, type: global, expr: rf.Q_0, unit: "1", label: "dielectric Q of the lowest mode"}
  tables:
    - {id: tbl_eig, from: ev_eig}
  plots:
    - id: E_mode
      type: plot3d
      data: sol_eig
      steps: 0
      items:
        - {id: E_mode_surf, type: surface, expr: "sqrt(rf.E_nodal.x^2 + rf.E_nodal.y^2 + rf.E_nodal.z^2)", unit: V/m}
provenance:
  values:
    params.a: {basis: benchmark, source: "Palace documentation, examples/cylinder.md lines 26-28 (as tabulated in eval case RF-01)", date: 2026-11-06}
    params.d: {basis: benchmark, source: "Palace documentation, examples/cylinder.md (as tabulated in eval case RF-01): d = 2a", date: 2026-11-06}
    materials.fill.override.eps_r: {basis: benchmark, source: "eval/cases/a/RF-21.yaml materials.fill.eps_r (Palace documentation, examples/cylinder.md)", date: 2026-11-06}
    materials.fill.override.tan_delta: {basis: benchmark, source: "eval/cases/a/RF-21.yaml materials.fill.tan_delta (Palace docs cylinder.md)", date: 2026-11-06}
    materials.fill.override.mu_r: {basis: benchmark, source: "eval/cases/a/RF-21.yaml materials.fill.mu_r (Palace docs cylinder.md)", date: 2026-11-06}
    studies.eig.settings.shift: {basis: benchmark, source: "eval/cases/a/RF-21.yaml study.shift", date: 2026-11-06}
    studies.eig.settings.nModes: {basis: user, date: 2026-11-06, note: "modelling choice with margin: below 5.0 GHz the analytic spectrum has degenerate pairs (azimuthal index > 0) and modes not listed in RF-01, so more than six eigenvalues are needed"}
    mesh.size.hmax: {basis: user, date: 2026-11-06, note: "modelling choice, to be set by the convergence study"}
assumptions:
  - {text: "Walls are PEC; the copper-wall Q variant of RF-01 (Rs 0.0184 Ohm) is not modelled here", paths: [physics.rf.bcs.walls]}
# eval: [RF-21, RF-01]   (informative pairing: the case specs run on cylinder-cavity-axisym and cylinder-cavity-qd)
