# CP-03 (eval/cases/c/CP-03.yaml): long wire with uniform heat generation and surface convection (Rohsenow-Choi 1963 ex. 6.5
# as used by Ansys VM58; inputs converted to SI by validation/c/gen_suites.py). Closed form (eval/expected/CP-03.json):
# T_center 488.6719 K, T_surface 487.5106 K. Axisymmetric (r, z) section of a 1 ft length with insulated ends (1D radial).
# Rights: Ansys VM page cite_values + re_derive_setup only; no text or input file is copied.
schema: amp-spec/0
id: heated-wire
title: Heated wire, convection
description: Wire r0 = 9.525 mm, k 22.5 W/(m K), q''' 1.152 MW/m^3, convection h 28.39 W/(m^2 K) to 294.26 K; centre and surface temperature.
params:
  r0: {value: 0.009525, unit: m, description: wire radius}
  Lz: {value: 0.3048, unit: m, description: modelled length (1 ft)}
  h: {value: 28.391316688883375, unit: W/(m^2*K), description: film coefficient}
  T_inf: {value: 294.26111111111106, unit: K, description: air temperature}
  q_gen: {value: 1152043.498788998, unit: W/m^3, description: volumetric heat generation}
geometry:
  dim: 2
  axisym: true
  features:
    - {id: wire, type: rect, settings: {size: ["r0", "Lz"], center: ["r0/2", "Lz/2"]}}
materials:
  - {id: wire_mat, override: {k: {value: 22.4995506496063, unit: W/(m*K)}}, select: ["dom:wire"]}
physics:
  - id: ht
    type: heat
    select: ["dom:wire"]
    bcs:
      - {id: film, type: convection, select: ["bnd:wire.right"], settings: {h: "h", T_ext: "T_inf"}}
      - {id: ends, type: insulation, select: ["bnd:wire.top", "bnd:wire.bottom"]}
      - {id: gen, type: heat-source, select: ["dom:wire"], settings: {Q: "q_gen"}}
mesh:
  size: {hmax: "r0/4"}
studies:
  - {id: std1, type: stationary, physics: [ht]}
results:
  datasets:
    - {id: sol_std1, type: solution, data: std1}
  evaluations:
    - id: ev_std1
      data: sol_std1
      items:
        - {id: T_center, type: global, expr: ht.T_max, unit: K}
        - {id: T_surface, type: global, expr: ht.T_min, unit: K}
  tables:
    - {id: tbl_std1, from: ev_std1}
  plots:
    - id: T_map
      type: plot2d
      data: sol_std1
      items:
        - {id: T_map_surf, type: surface, expr: ht.T, unit: K}
provenance:
  values:
    params.r0: {basis: benchmark, source: "eval/cases/c/CP-03.yaml geometry.spec.r0_m (VM58 via gen_suites.py)", date: 2026-11-06}
    params.Lz: {basis: benchmark, source: "eval/cases/c/CP-03.yaml geometry.spec.length_m", date: 2026-11-06}
    params.h: {basis: benchmark, source: "eval/cases/c/CP-03.yaml bcs[0].params.h_W_per_m2K (5 Btu/hr-ft2-F)", date: 2026-11-06}
    params.T_inf: {basis: benchmark, source: "eval/cases/c/CP-03.yaml bcs[0].params.T_inf_K", date: 2026-11-06}
    params.q_gen: {basis: benchmark, source: "eval/cases/c/CP-03.yaml bcs[1].params.q_W_per_m3", date: 2026-11-06}
    materials.wire_mat.override.k: {basis: benchmark, source: "eval/cases/c/CP-03.yaml materials.wire.k_W_per_mK (13 Btu/hr-ft-F)", date: 2026-11-06}
    mesh.size.hmax: {basis: user, date: 2026-11-06, note: "modelling choice"}
assumptions:
  - {text: "Long wire: insulated ends make the axisymmetric field purely radial, so T_max = T(r = 0) and T_min = T(r0)", paths: [physics.ht.bcs.ends]}
# eval: [CP-03]
