# MPB Python tutorial triangular lattice of dielectric rods (r 0.2 a, eps 12, air), TM (E_z) band structure on the
# Gamma-M-K-Gamma path, solved as a Bloch eigenproblem of emw-2d on one rhombic unit cell (lattice vectors
# a1 = (a, 0), a2 = (a/2, sqrt(3) a/2); two periodic conditions with a tangential offset) (DevLog-050). Band 1 maximum
# and band 2 minimum bound the first TM gap; references: MPB 1.34.0 resolution study (Richardson) and an independent
# plane-wave expansion (eval/expected/WO-61.json; case WO-93). M = b2 / 2 and K = (b1 + 2 b2) / 3 on this cell's
# reciprocal vectors are the points MPB writes as (0, 0.5) and (-1/3, 1/3) on its own basis (same symmetry points).
# Rights: GPL-2.0-or-later (MPB / Meep), cite_values + re_derive_setup + copy_with_attribution; no tutorial file is copied.
schema: amp-spec/0
id: phc-triangular-rods-bands
title: Triangular rod lattice, TM band structure
description: Bloch eigenfrequencies of the r 0.2a, eps 12 triangular rod lattice along Gamma-M-K-Gamma (8 bands) on a rhombic unit cell; band 1 maximum and band 2 minimum bound the first TM gap.
params:
  a: {value: 1, unit: um, description: lattice constant (the bands scale with c / a)}
  r_rod: {value: 0.2, unit: um, description: rod radius (0.2 a)}
  eps_rod: {value: 12, description: rod permittivity}
geometry:
  dim: 2
  features:
    - {id: cell, type: polygon, settings: {points: [["0 um", "0 um"], ["a", "0 um"], ["1.5*a", "sqrt(3)/2*a"], ["0.5*a", "sqrt(3)/2*a"]]}}
    - {id: disk, type: circle, settings: {center: ["0.75*a", "sqrt(3)/4*a"], radius: "r_rod"}}
    - {id: bg, type: difference, settings: {base: cell, tools: [disk], keepTools: true}}
materials:
  - {id: air, override: {eps_r: 1, mu_r: 1}, select: ["dom:bg"]}
  - {id: rod_mat, override: {eps_r: "eps_rod", mu_r: 1}, select: ["dom:disk"]}
physics:
  - id: w
    type: emw-2d
    select: ["dom:bg", "dom:disk"]
    settings: {polarization: TM}
    bcs:
      - {id: p1, type: periodic, select: ["bnd:cell.e3", "bnd:cell.e1"]}
      - {id: p2, type: periodic, select: ["bnd:cell.e0", "bnd:cell.e2"]}
mesh:
  size: {hmax: "a/10"}
  refine:
    - {select: ["bnd:disk.edge"], h: "a/40"}
studies:
  - id: bands
    type: bands
    physics: [w]
    settings:
      kPath:
        - {label: Gamma, k: [0, 0]}
        - {label: M, k: [0, 0.5]}
        - {label: K, k: [0.3333333333333333, 0.6666666666666666]}
        - {label: Gamma, k: [0, 0]}
      interpolate: 4
      nBands: 8
results:
  datasets:
    - {id: sol_bands, type: solution, data: bands}
  evaluations:
    - id: ev_gap
      data: sol_bands
      items:
        - {id: gap_lower, type: global, expr: w.fmax_0, unit: THz, label: "band 1 maximum (lower gap edge)"}
        - {id: gap_upper, type: global, expr: w.fmin_1, unit: THz, label: "band 2 minimum (upper gap edge)"}
  tables:
    - {id: tbl_gap, from: ev_gap}
  plots:
    # field steps run through the labelled points in path order, 8 bands each: step 16 = band 1 at K
    - id: mode
      type: plot2d
      data: sol_bands
      steps: 16
      items:
        - {id: mode_surf, type: surface, expr: w.Ez_re, unit: V/m, colormap: balance}
provenance:
  values:
    params.a: {basis: user, date: 2026-11-18, note: "scale choice; MPB works in units of a and the eigenfrequencies scale as c / a"}
    params.r_rod: {basis: benchmark, source: "eval/cases/c/WO-61.yaml geometry.spec.rod_radius (0.2 a; MPB Python_Tutorial.md)", date: 2026-11-18}
    params.eps_rod: {basis: benchmark, source: "eval/cases/c/WO-61.yaml materials.rod.eps_r (MPB Python_Tutorial.md)", date: 2026-11-18}
    materials.air.override.eps_r: {basis: benchmark, source: "MPB tutorial default background (air, eps 1)", date: 2026-11-18}
    mesh.size.hmax: {basis: user, date: 2026-11-18, note: "modelling choice"}
    mesh.refine.0.h: {basis: user, date: 2026-11-18, note: "modelling choice"}
    studies.bands.settings.kPath: {basis: benchmark, source: "MPB Python tutorial triangular k path Gamma, M, K, Gamma with mp.interpolate(4, ...), written on this cell's reciprocal basis", date: 2026-11-18}
assumptions:
  - {text: "Lossless, non-magnetic media; TM polarization (E_z out of plane); Bloch periodicity over one rhombic unit cell", paths: [physics.w]}
# eval: [WO-93]
