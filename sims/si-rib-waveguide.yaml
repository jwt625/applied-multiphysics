# H4 Rib waveguide modes (DevLog-001 s.8). Geometry and wavelength of eval gate WO-02 (R3; Hadley 2002 rib as
# re-tabulated in the femwell benchmarks): lambda 1.15 um, n 3.44 / 3.40 / 1, rib 3 x 1 um, slab t = 0..0.7 um,
# reference n_eff 3.412022 (t = 0) ... 3.414100 (t = 0.7 um). A Si/SiO2 SOI variant is not defined yet (see missing).
schema: amp-spec/0
id: si-rib-waveguide
title: Rib waveguide modes
description: Full-vector modes of a rib waveguide; sweep the slab thickness and watch the effective index.
params:
  lambda0: {value: 1.15, unit: um, description: vacuum wavelength}
  w_rib: {value: 3, unit: um, description: rib width}
  H: {value: 1, unit: um, description: "rib height above the substrate, slab included"}
  t: {value: 0.1, unit: um, range: [0.1, 0.7], description: slab thickness}
  W_win: {value: 10, unit: um, description: computational window width}
  D_sub: {value: 3, unit: um, description: substrate depth in the window}
  H_cov: {value: 3, unit: um, description: cover height in the window}
geometry:
  dim: 2
  features:
    - {id: cover, type: rect, settings: {size: ["W_win", "H_cov"], center: ["0 um", "H_cov/2"]}}
    - {id: substrate, type: rect, settings: {size: ["W_win", "D_sub"], center: ["0 um", "-D_sub/2"]}}
    - {id: slab, type: rect, settings: {size: ["W_win", "t"], center: ["0 um", "t/2"]}}
    - {id: rib, type: rect, settings: {size: ["w_rib", "H"], center: ["0 um", "H/2"]}}
    - {id: guide, type: union, settings: {inputs: [slab, rib]}}
    - {id: clad, type: difference, settings: {base: cover, tools: [guide], keepTools: true}}
materials:
  - {id: core, override: {n: N/A}, select: ["dom:guide"]}
  - {id: sub, override: {n: N/A}, select: ["dom:substrate"]}
  - {id: cov, override: {n: N/A}, select: ["dom:clad"]}
physics:
  - id: ewg
    type: em-modes
    select: ["dom:guide", "dom:substrate", "dom:clad"]
    bcs:
      - id: walls
        type: pec
        select: ["bnd:cover.left", "bnd:cover.right", "bnd:cover.top", "bnd:substrate.left", "bnd:substrate.right", "bnd:substrate.bottom", "bnd:slab.left", "bnd:slab.right"]
mesh:
  size: {hmax: "W_win/40"}
  refine:
    - {select: ["dom:guide"], h: "t/4"}
studies:
  - {id: modes, type: mode, physics: [ewg], settings: {wavelength: "lambda0", nModes: 2}}
  - id: sweep_t
    type: parametric
    physics: [ewg]
    settings:
      study: modes
      sweep:
        - {param: t, values: ["0.1 um", "0.2 um", "0.3 um", "0.4 um", "0.5 um", "0.6 um", "0.7 um"]}
results:
  - {id: neff, type: table, data: sweep_t, expr: ewg.neff, unit: "1"}
  - {id: E_map, type: plot2d, data: modes, expr: ewg.normE, unit: V/m}
provenance:
  values:
    params.lambda0: {basis: benchmark, source: "R3 WO-02 (femwell benchmarks re-tabulating Hadley, JLT 20:1219)", date: 2026-11-06}
    params.w_rib: {basis: benchmark, source: "R3 WO-02: rib 3 x 1 um", date: 2026-11-06}
    params.H: {basis: benchmark, source: "R3 WO-02: rib 3 x 1 um", date: 2026-11-06}
    studies.sweep_t.settings.sweep.0.values: {basis: benchmark, source: "R3 WO-02: t = 0.1 ... 0.7 um", date: 2026-11-06}
    params.t: {basis: user, date: 2026-11-06, note: "base value; the sweep sets it"}
    params.W_win: {basis: user, date: 2026-11-06, note: "modelling choice, window truncation to be checked by convergence"}
    params.D_sub: {basis: user, date: 2026-11-06, note: "modelling choice, window truncation to be checked by convergence"}
    params.H_cov: {basis: user, date: 2026-11-06, note: "modelling choice, window truncation to be checked by convergence"}
    mesh.size.hmax: {basis: user, date: 2026-11-06, note: "modelling choice, to be set by the convergence study"}
    mesh.refine.0.h: {basis: user, date: 2026-11-06, note: "modelling choice, to be set by the convergence study"}
assumptions:
  - {text: "Rib height H = 1 um is measured from the substrate interface and includes the slab; R3 only says 'rib 3 x 1 um' (check the femwell source)", paths: [params.H]}
  - {text: "Rib material over the substrate, cover above; the three indices of R3 map to rib (guide), substrate and cover in that order", paths: [materials]}
  - {text: "PEC on the window boundary is a truncation; the guided mode must have decayed there", paths: [physics.ewg.bcs.walls]}
missing:
  - {path: materials.core.override.n, what: "rib index; R3 WO-02 gives 3.44 (benchmark material, no materials/ entry yet)", needed_for: [solution]}
  - {path: materials.sub.override.n, what: "substrate index; R3 WO-02 gives 3.40", needed_for: [solution]}
  - {path: materials.cov.override.n, what: "cover index; R3 WO-02 gives 1", needed_for: [solution]}
  - {what: "t = 0 point of the WO-02 table needs a geometry variant without the slab (zero-thickness feature)", needed_for: [geometry, eval]}
  - {what: "Si/SiO2 SOI rib geometry for the 'Si rib' hero: no sourced case defines it (WO-01 is a 1D slab)", needed_for: [geometry]}
  - {what: "which mode (polarization) WO-02 gates is not stated in the R3 summary", needed_for: [eval]}
