# Titanium nitride film (lane T4, DevLog-041), for plasmonics and heaters. Optical constants of one named deposition
# (pulsed-DC sputtered 50 nm film, Beliaev et al. 2023); one named 3-omega film k as an alternative (Moraes 2015). Electrical and mechanical film values: N/A.
schema: amp-material/0
id: tin-film
name: Titanium nitride film (sputtered)
class: ceramic
description: >-
  TiN thin film. Complex refractive index of a 50 nm pulsed-DC sputtered film on Si (Beliaev et al. 2023, ellipsometry
  and FTIR); thermal conductivity of one 580 nm dc reactive-sputtered fcc TiN film (Moraes 2015, 3-omega) as an alternative only. TiN film properties depend strongly on deposition method, temperature and stoichiometry.
