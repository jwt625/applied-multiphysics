    accessed: 2026-10-20
    uncertainty: {rel: 0.001, note: "Swenson 1983 p.181 (as read in a 2026-11-06 review, not re-read): +-0.1 % or +-1e-9 /K, whichever is greater, below 300 K; up to +-1e-8 /K to 850 K"}
    conditions: {text: "evaluated recommended values"}
