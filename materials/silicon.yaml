    accessed: 2026-10-20
    uncertainty: {abs: 0.005, note: "digitization reading uncertainty (APA)"}
    conditions: {f: "6.62 GHz", text: "float-zone high-resistivity p-type Si, 6.62-11.5 GHz; source: permittivity independent of frequency in that band"}
