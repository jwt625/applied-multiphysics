      xs: [200, 220, 240, 260, 280, 293.15, 300, 325, 350, 375, 400, 450, 500, 550, 600]
      ys: [1.406, 1.715, 1.986, 2.223, 2.432, 2.555, 2.618, 2.816, 2.984, 3.128, 3.251, 3.453, 3.610, 3.737, 3.844]
