      xs: [1.20, 1.22, 1.24, 1.26, 1.28, 1.30, 1.32, 1.34, 1.36, 1.38, 1.40, 1.45, 1.55, 1.60, 1.65, 1.70, 1.90, 2.00, 2.25, 2.50, 2.75, 3.00, 4.00, 5.00, 6.00, 7.00, 8.00, 9.00, 10.00, 11.00, 12.00, 13.00, 14.00]
      ys: [3.5167, 3.5133, 3.5102, 3.5072, 3.5043, 3.5016, 3.4990, 3.4965, 3.4941, 3.4918, 3.4896, 3.4845, 3.4757, 3.4719, 3.4684, 3.4653, 3.4550, 3.4510, 3.4431, 3.4375, 3.4334, 3.4302, 3.4229, 3.4195, 3.4177, 3.4165, 3.4158, 3.4153, 3.4150, 3.4147, 3.4145, 3.4144, 3.4142]
    unit: "1"
    basis: measured
    source: li1980
    locator: "journal p.576 Table 1 'Recommended values on the refractive index of silicon', column 293 K (read from a 300 dpi page render)"
    accessed: 2026-11-06
    uncertainty: {abs: 0.002, note: "p.567 text: recommended values from eq (22) 'with uncertainties of +- 2 x 10-3'; last digit printed with overstrike = insignificant"}
    conditions: {T: "293 K", text: "evaluated recommended values (dispersion equation fitted to selected data sets)"}
    n_medium: air
    n_medium_note: "inferred, not stated for silicon: Li 1980 (journal p.583, pdf p.24) compares germanium data of Rank et al. only after 'correcting from vacuum values to air values' against Salzberg and Villa, so the compilation works in air values; converted to vacuum with air.n (the shift, about 9e-4 at 1.55 um, is below the +-2e-3 uncertainty)"
    valid: {T: {unit: K, range: [293, 293]}, note: "293 K column only; use dndT for other T"}
    note: "rows 1.50 and 1.80 um not transcribed: the 1.50 um entry is crossed by a pen line and the 1.80 um entry has an ambiguous glyph in the scan; the 1.65 um row label is smudged, value read in sequence"
    alternatives:
      - id: salzberg_villa_tatian
        use: "sensitivity (Sellmeier fit used by eo-modulator-atlas; 26 C data)"
        fit:
          formula: sellmeier-c2
          vars: [{name: lambda, unit: um, range: [1.357, 11.04]}]
          coeffs: {A: 0, B: [10.6684293, 0.0030434748, 1.54133408], C: [0.301516485, 1.13475115, 1104.0]}
        unit: "1"
        basis: measured
        source: salzberg1957
        locator: "refractiveindex.info Si/nk/Salzberg.yml: formula 1, coefficients 0 10.6684293 0.301516485 0.0030434748 1.13475115 1.54133408 1104 (Tatian 1984 fit of Salzberg-Villa data)"
        accessed: 2026-11-06
        uncertainty: {na: "not stated in the database entry"}
        conditions: {T: "26 degC", text: "unknown purity (database comment)"}
        n_medium: air
        n_medium_note: "inferred, not stated for silicon: Li 1980 (journal p.583, pdf p.24) compares germanium data of Rank et al. only after 'correcting from vacuum values to air values' against Salzberg and Villa, so the compilation works in air values"
        valid: {T: {unit: degC, range: [26, 26]}}
      - id: li1980_eq22
        use: "smooth dispersion for group index: the Li 1980 eq. (22) that generated Table 1, at 293 K"
        fit:
          formula: li1980-eq22
          vars: [{name: lambda, unit: um, range: [1.2, 14]}, {name: T, unit: K, range: [100, 750]}]
          coeffs: {eps: [11.4445, 2.7739e-4, 1.7050e-6, -8.1347e-10], A: [0.8948, 4.3977e-4, 7.3835e-8]}
        unit: "1"
        basis: measured
        source: li1980
        locator: "journal p.567 eq. (22) and coefficients (300 dpi page render, read 2026-11-18): n^2 = eps(T) + L(T)/lambda^2 (A0 + A1 T + A2 T^2), eps(T) = 11.4445 + 2.7739e-4 T + 1.7050e-6 T^2 - 8.1347e-10 T^3, A0 0.8948, A1 4.3977e-4, A2 7.3835e-8; 1.2-14 um, 100-750 K"
        accessed: 2026-11-18
        derivation: "L(T) = exp(-3 dL(T)/L293) set to 1 (exact at 293 K by the definition of L293). The p.568 dL/L293 polynomials as read give -0.0703 (293-1600 K form) and -0.0208 (20-293 K form) at 293 K instead of 0, and their slopes match neither fraction nor percent units consistently, so they are not used and the fit is restricted to 293 K. Check against Table 1 (293 K): |eq. 22 - table| <= 3.5e-5 at 1.2, 1.3, 1.4, 1.55, 2, 3, 5, 10, 14 um"
        uncertainty: {abs: 0.002, note: "p.567-568: recommended values from eq. (22) with uncertainties of +-2e-3"}
        conditions: {T: "293 K", text: "evaluated recommended dispersion equation"}
        n_medium: air
        n_medium_note: "same data basis as Table 1 (inferred air values, see the default leaf)"
        valid: {T: {unit: K, range: [293, 293]}, lambda: {unit: um, range: [1.2, 14]}, note: "eq. (22) is stated for 100-750 K; restricted here to 293 K because L(T) is not applied; use dndT for other T"}
