    value: 2.3290
    unit: g/cm^3
    basis: measured
    source: hall1967
    locator: "journal p.757 Sec. II: pure-sample density 2.3290 +- 0.0002 g/cm3 at 25 C (hydrometric)"
    accessed: 2026-11-06
    uncertainty: {abs: 0.0002, unit: g/cm^3}
    conditions: {T: "25 degC", text: "pure (undoped, 150 ohm cm n-type) sample"}
    alternatives: []
  C:
    tensor:
      symmetry: cubic
      components: {C11: 165.64, C12: 63.94, C44: 79.51}
    unit: GPa
    basis: measured
    source: hall1967
    locator: "journal p.758 Table III column 'Present study': C11 1.6564, C12 0.6394, C44 0.7951 (1e12 dyn/cm2, pure Si, 25 C)"
    accessed: 2026-11-06
    derivation: "1e12 dyn/cm2 = 100 GPa (exact); values multiplied by 100"
    uncertainty: {rel: 0.0002, note: "Table III: +-0.02 %; Table VI (p.760): C11 1.6564 +- 0.0003, C44 0.7951 +- 0.0002 (1e12 dyn/cm2)"}
    conditions: {T: "25 degC", text: "adiabatic moduli, ultrasonic pulse echo; pure Si"}
    alternatives:
      - id: mcskimin1964
        use: "sensitivity (second measurement in the same table)"
        tensor:
          symmetry: cubic
          components: {C11: 165.63, C12: 63.87, C44: 79.55}
        unit: GPa
        basis: measured
        source: hall1967
        locator: "journal p.758 Table III column 'McSkimin and Andreatch' (1.6563, 0.6387, 0.7955 x 1e12 dyn/cm2)"
        accessed: 2026-11-06
        derivation: "1e12 dyn/cm2 = 100 GPa (exact)"
        uncertainty: {na: "not stated in Hall Table III for this column"}
        conditions: {T: "25 degC"}
  E:
    value: N/A
    unit: GPa
    missing: "anisotropic crystal: Young's modulus depends on direction; use the stiffness tensor C (a direction-dependent E follows from C, not stored)"
    alternatives: []
  nu:
    value: N/A
    unit: "1"
    missing: "anisotropic crystal: Poisson's ratio depends on direction; use C"
    alternatives: []
  k:
