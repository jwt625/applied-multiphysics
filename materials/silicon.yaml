    accessed: 2026-10-20
    uncertainty: {abs: 0.005, rel: 0.001, note: "abs: digitization reading uncertainty (advanced-packaging-atlas); rel: Krupka 2006 p.3 'experimental errors in the range of 0.1 %' (as read in a 2026-11-06 review from the advanced-packaging-atlas local copy, not re-read)"}
