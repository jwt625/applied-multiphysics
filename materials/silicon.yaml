# Single-crystal silicon (lane L10, DevLog-013). Stored values are in the units the source prints (or an exact
# power-of-ten rescaling, stated in `derivation`); @amp/materials converts to SI on load.
schema: amp-material/0
id: silicon
name: Silicon, single crystal
class: semiconductor
description: >-
  Undoped or lightly doped single-crystal Si. Mechanics as the cubic stiffness tensor (no isotropic E or nu stored);
  optics from the Li 1980 evaluated table at 293 K; RF permittivity of float-zone high-resistivity Si.
verified_on: 2026-11-06
frame: "crystal axes: x = [100], y = [010], z = [001]"
sources:
  hall1967:
    citation: "J. J. Hall, Electronic effects in the elastic constants of n-type silicon, Phys. Rev. 161(3), 756-761 (1967)"
    doi: 10.1103/PhysRev.161.756
    access: local_cache
    read: "text layer of the local copy (advanced-packaging-atlas references/physrev.161.756/source.pdf, sha256 8b8fc2b9...), journal p.757 Sec. II (density), p.758 Table III and p.760 Table VI (moduli); read by L10 2026-11-06"
  hpl1972:
    citation: "C. Y. Ho, R. W. Powell, P. E. Liley, Thermal conductivity of the elements, J. Phys. Chem. Ref. Data 1, 279-421 (1972)"
    doi: 10.1063/1.3253100
    url: https://srd.nist.gov/jpcrdreprint/1.3253100.pdf
    access: open
    read: "not re-read by L10; values transcribed from the APA data file, whose lane read the p.394 recommended-value table on 2026-10-20"
    via: "advanced-packaging-atlas engine/data/materials/silicon.yaml at 608b1dc (si_crystal.properties.k)"
  janaf1998:
    citation: "M. W. Chase Jr., NIST-JANAF Thermochemical Tables, 4th ed., J. Phys. Chem. Ref. Data Monograph 9 (1998), p.1881, Silicon (Si) reference-state table"
    url: https://janaf.nist.gov/tables/Si-001.html
    access: open
    read: "not re-read by L10; APA lane read the web table and the scanned monograph page on 2026-10-21"
    via: "advanced-packaging-atlas engine/data/materials/silicon.yaml at 608b1dc (si_crystal.properties.cp)"
  swenson1983:
    citation: "C. A. Swenson, Recommended values for the thermal expansivity of silicon from 0 to 1000 K, J. Phys. Chem. Ref. Data 12, 179-182 (1983)"
    doi: 10.1063/1.555681
    url: https://srd.nist.gov/jpcrdreprint/1.555681.pdf
    access: open
    read: "not re-read by L10; APA lane read p.180-181 (Tables 1, 2) on 2026-10-20"
    via: "advanced-packaging-atlas engine/data/materials/silicon.yaml at 608b1dc (si_crystal.properties.cte)"
  krupka2006:
    citation: "J. Krupka et al., Measurements of permittivity, dielectric loss tangent, and resistivity of float-zone silicon at microwave frequencies, IEEE Trans. Microw. Theory Tech. 54(11), 3995-4001 (2006)"
    doi: 10.1109/TMTT.2006.883655
    access: local_cache
    read: "not re-read by L10; APA lane digitized Fig. 2 (p.3) on 2026-10-20"
    via: "advanced-packaging-atlas engine/data/materials/silicon.yaml at 608b1dc (si_crystal.properties.eps_r)"
  li1980:
    citation: "H. H. Li, Refractive index of silicon and germanium and its wavelength and temperature derivatives, J. Phys. Chem. Ref. Data 9(3), 561-658 (1980)"
    doi: 10.1063/1.555624
    url: https://srd.nist.gov/jpcrdreprint/1.555624.pdf
    access: open
    read: "page renders (300 dpi) of journal p.577 Table 1 and p.579 Table 2 (pdf pages 17, 19), 293 K columns; text layer p.567-568; read by L10 2026-11-06; cached under cache/materials/silicon/"
  salzberg1957:
    citation: "C. D. Salzberg, J. J. Villa, Infrared refractive indexes of silicon, germanium and modified selenium glass, J. Opt. Soc. Am. 47, 244-246 (1957); Sellmeier fit by B. Tatian, Appl. Opt. 23, 4477-4485 (1984)"
    doi: 10.1364/JOSA.47.000244
    url: https://github.com/polyanskiy/refractiveindex.info-database/blob/main/database/data/main/Si/nk/Salzberg.yml
    access: paywalled
    read: "primary not read; coefficients from the refractiveindex.info entry (CC0) Si/nk/Salzberg.yml, fetched 2026-11-06 (also used by eo-modulator-atlas engine/data/materials.json)"
    licence: "refractiveindex.info database: CC0 1.0"
properties:
