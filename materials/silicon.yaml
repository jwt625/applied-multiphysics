properties:
  rho:
    value: 2.3290
    unit: g/cm^3
    basis: measured
    source: hall1967
    locator: "journal p.757 Sec. II: pure-sample density 2.3290 +- 0.0002 g/cm3 at 25 C (hydrometric)"
    accessed: 2026-11-06
    uncertainty: {abs: 0.0002, unit: g/cm^3}
    conditions: {T: "25 degC", text: "pure (undoped, 150 ohm cm n-type) sample"}
    valid: {T: {unit: degC, range: [25, 25]}, note: "single measured temperature; T dependence not applied"}
    alternatives: []
  C:
    tensor:
      symmetry: cubic
      components: {C11: 165.64, C12: 63.94, C44: 79.51}
    unit: GPa
    basis: measured
    source: hall1967
    locator: "journal p.758 Table III column 'Present study': C11 1.6564, C12 0.6394, C44 0.7951 (1e12 dyn/cm2, pure Si, 25 C)"
    accessed: 2026-11-06
    derivation: "1e12 dyn/cm2 = 100 GPa (exact); values multiplied by 100"
    uncertainty: {rel: 0.0002, note: "Table III: +-0.02 %; Table VI (p.760): C11 1.6564 +- 0.0003, C44 0.7951 +- 0.0002 (1e12 dyn/cm2)"}
    conditions: {T: "25 degC", text: "adiabatic moduli, ultrasonic pulse echo; pure Si"}
    valid: {T: {unit: degC, range: [25, 25]}, note: "single measured temperature (Hall gives Cij(T) only 4.2-310 K in figures)"}
    alternatives:
      - id: mcskimin1964
        use: "sensitivity (second measurement in the same table)"
        tensor:
          symmetry: cubic
          components: {C11: 165.63, C12: 63.87, C44: 79.55}
        unit: GPa
        basis: measured
        source: hall1967
        locator: "journal p.758 Table III column 'McSkimin and Andreatch' (1.6563, 0.6387, 0.7955 x 1e12 dyn/cm2)"
        accessed: 2026-11-06
        derivation: "1e12 dyn/cm2 = 100 GPa (exact)"
        uncertainty: {na: "not stated in Hall Table III for this column"}
        conditions: {T: "25 degC"}
        valid: {T: {unit: degC, range: [25, 25]}}
  E:
    value: 162.58
    unit: GPa
    basis: derived
    source: hall1967
    locator: "journal p.758 Table III column 'Present study' (C11, C12, C44), as in the C leaf of this file"
    accessed: 2026-11-18
    derivation: "Voigt-Reuss-Hill average (Hill 1952 rule) of the Hall 1967 cubic C (C11 165.64, C12 63.94, C44 79.51 GPa): K = (C11 + 2 C12)/3 = 97.840 GPa; G_V = (C11 - C12 + 3 C44)/5 = 68.046 GPa; G_R = 5 / (4/(C11 - C12) + 3/C44) = 64.882 GPa; G_H = (G_V + G_R)/2 = 66.464 GPa; E = 9 K G_H / (3 K + G_H) = 162.58 GPa (computed 2026-11-18; same rule as validation/mp/references.py hill_isotropic). Isotropic equivalent of a randomly oriented polycrystal, not a property of any direction of the single crystal: from C, E is 130.0 GPa along <100> and 187.7 GPa along <111>"
    uncertainty: {na: "averaging-rule spread: Voigt 165.72, Reuss 159.41 GPa (alternatives); the measurement uncertainty of C (0.02 %) is far smaller"}
    conditions: {T: "25 degC", text: "isotropic average for models that take scalar E, nu (e.g. TSV or die thermal stress with an isotropic solver); use C for anisotropic models"}
    valid: {T: {unit: degC, range: [25, 25]}, note: "C measured at 25 C only"}
    note: "modelling choice of an isotropic equivalent (Hill average), stated so that isotropic elastic models can run from the library; direction-dependent stress needs C"
    alternatives:
      - id: voigt
        use: "upper bound of the isotropic average (sensitivity)"
        value: 165.72
        unit: GPa
        basis: derived
        source: hall1967
        locator: "journal p.758 Table III (C11, C12, C44)"
        accessed: 2026-11-18
        derivation: "Voigt: G_V = 68.046 GPa, K = 97.840 GPa, E = 9 K G_V / (3 K + G_V)"
        uncertainty: {na: "derived bound or direction value, not a measurement"}
        conditions: {T: "25 degC"}
        valid: {T: {unit: degC, range: [25, 25]}}
      - id: reuss
        use: "lower bound of the isotropic average (sensitivity)"
        value: 159.41
        unit: GPa
        basis: derived
        source: hall1967
        locator: "journal p.758 Table III (C11, C12, C44)"
        accessed: 2026-11-18
        derivation: "Reuss: G_R = 64.882 GPa, K = 97.840 GPa, E = 9 K G_R / (3 K + G_R)"
        uncertainty: {na: "derived bound or direction value, not a measurement"}
        conditions: {T: "25 degC"}
        valid: {T: {unit: degC, range: [25, 25]}}
      - id: dir100
        use: "Young modulus along <100> (e.g. along a <100> edge of a (001) wafer)"
        value: 130.02
        unit: GPa
        basis: derived
        source: hall1967
        locator: "journal p.758 Table III (C11, C12, C44)"
        accessed: 2026-11-18
        derivation: "E<100> = 1 / S11, S11 = (C11 + C12) / ((C11 - C12)(C11 + 2 C12))"
        uncertainty: {na: "derived bound or direction value, not a measurement"}
        conditions: {T: "25 degC"}
        valid: {T: {unit: degC, range: [25, 25]}}
  nu:
    value: 0.2231
    unit: "1"
    basis: derived
    source: hall1967
    locator: "journal p.758 Table III column 'Present study' (C11, C12, C44), as in the C leaf of this file"
    accessed: 2026-11-18
    derivation: "Voigt-Reuss-Hill average (Hill 1952 rule) of the Hall 1967 cubic C (C11 165.64, C12 63.94, C44 79.51 GPa): K = (C11 + 2 C12)/3 = 97.840 GPa; G_V = (C11 - C12 + 3 C44)/5 = 68.046 GPa; G_R = 5 / (4/(C11 - C12) + 3/C44) = 64.882 GPa; G_H = (G_V + G_R)/2 = 66.464 GPa; nu = (3 K - 2 G_H) / (2 (3 K + G_H)) = 0.2231 (computed 2026-11-18). Pairs with the Hill E of this file; not a property of any crystal direction (<100> pull, <010> contraction: 0.2785)"
    uncertainty: {na: "averaging-rule spread: Voigt 0.2177, Reuss 0.2285 (alternatives)"}
    conditions: {T: "25 degC", text: "isotropic average; use C for anisotropic models"}
    valid: {T: {unit: degC, range: [25, 25]}, note: "C measured at 25 C only"}
    note: "modelling choice of an isotropic equivalent (Hill average); see E"
    alternatives:
      - id: voigt
        use: "Voigt average (sensitivity; pairs with E alternative voigt)"
        value: 0.2177
        unit: "1"
        basis: derived
        source: hall1967
        locator: "journal p.758 Table III (C11, C12, C44)"
        accessed: 2026-11-18
        derivation: "nu = (3 K - 2 G_V) / (2 (3 K + G_V)), G_V = 68.046 GPa"
        uncertainty: {na: "derived bound or direction value, not a measurement"}
        conditions: {T: "25 degC"}
        valid: {T: {unit: degC, range: [25, 25]}}
      - id: reuss
        use: "Reuss average (sensitivity; pairs with E alternative reuss)"
        value: 0.2285
        unit: "1"
        basis: derived
        source: hall1967
        locator: "journal p.758 Table III (C11, C12, C44)"
        accessed: 2026-11-18
        derivation: "nu = (3 K - 2 G_R) / (2 (3 K + G_R)), G_R = 64.882 GPa"
        uncertainty: {na: "derived bound or direction value, not a measurement"}
        conditions: {T: "25 degC"}
        valid: {T: {unit: degC, range: [25, 25]}}
      - id: dir100
        use: "Poisson ratio for a <100> pull and <010> contraction (pairs with E alternative dir100)"
        value: 0.2785
        unit: "1"
        basis: derived
        source: hall1967
        locator: "journal p.758 Table III (C11, C12, C44)"
        accessed: 2026-11-18
        derivation: "nu = -S12 / S11 = C12 / (C11 + C12)"
        uncertainty: {na: "derived bound or direction value, not a measurement"}
        conditions: {T: "25 degC"}
        valid: {T: {unit: degC, range: [25, 25]}}
  k:
