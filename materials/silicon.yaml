    derivation: "c_p = Cp / (A_r x 1e-3 kg/mol), computed by the APA lane"
    uncertainty: {na: "not transcribed"}
    conditions: {p: "0.1 MPa", text: "crystal"}
    alternatives: []
  alpha:
    table:
