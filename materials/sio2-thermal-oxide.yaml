# Thermal SiO2 film (lane L10, DevLog-013). No film-specific primary source was read in this lane; values are either
# paper model inputs (labelled) or bulk fused-silica values marked with analog_of.
schema: amp-material/0
id: sio2-thermal-oxide
name: SiO2, thermal oxide film
class: dielectric_film
description: >-
  Thermally grown SiO2 on Si (BOX / cladding). Optical index and thermal data are bulk fused-silica analogs (analog_of);
  RF permittivity and mechanics are model inputs from published tables, not film measurements.
verified_on: 2026-11-06
sources:
  malitson1965:
    citation: "I. H. Malitson, Interspecimen comparison of the refractive index of fused silica, J. Opt. Soc. Am. 55, 1205-1208 (1965)"
    doi: 10.1364/JOSA.55.001205
    url: https://github.com/polyanskiy/refractiveindex.info-database/blob/main/database/data/main/SiO2/nk/Malitson.yml
    access: paywalled
    read: "primary not read; refractiveindex.info SiO2/nk/Malitson.yml (CC0), fetched 2026-11-06"
    licence: "refractiveindex.info database: CC0 1.0"
  leviton2006:
    citation: "D. B. Leviton, B. J. Frey, Temperature-dependent absolute refractive index measurements of synthetic fused silica, Proc. SPIE 6273, 62732K (2006); arXiv:0805.0091"
    url: https://arxiv.org/abs/0805.0091
    access: open
    read: "text layer of the arXiv PDF, p.3 (air / vacuum convention), p.6 Table 3, p.7 Table 6, read by L10 2026-11-06"
  corning_hpfs_2014:
    citation: "Corning Incorporated, HPFS 7979, 7980, 8655 Fused Silica, Product Information Sheet, February 2014 (hosted by Edmund Optics)"
    url: "https://www.edmundoptics.co.uk/ViewDocument/Corning%20Fused%20Silica%20Grades.pdf"
    access: vendor_open
    read: "text layer p.3, read by L10 2026-11-06"
  zhu2021:
    citation: "D. Zhu et al., Integrated photonics on thin-film lithium niobate, Adv. Opt. Photon. 13, 242 (2021); arXiv:2102.11956"
    url: https://arxiv.org/abs/2102.11956
    access: open
    read: "not re-read by L10; EO lane read Table 1 (arXiv PDF p.5, rendered) on 2026-10-15; the table gives no primary reference"
    via: "eo-modulator-atlas engine/data/materials.json at bc68738 (library.silicon_dioxide.eps_r)"
  tcpmt2025_3538554:
    citation: "Double-layer-stacked silicon interposer for 2.5-D packaging of 32 x 32 micromirror array chip, IEEE Trans. Compon. Packag. Manuf. Technol. 15(4), 706-715 (2025)"
    doi: 10.1109/TCPMT.2025.3538554
    access: local_cache
    read: "not re-read by L10; APA lane read p.7 Table IV (page crop) on 2026-10-20"
    via: "advanced-packaging-atlas engine/data/materials/glass_inorganic.yaml at 608b1dc (sio2_film)"
properties:
  n:
    fit:
      formula: sellmeier-c2
      vars: [{name: lambda, unit: um, range: [0.21, 6.7]}]
      coeffs: {A: 0, B: [0.6961663, 0.4079426, 0.8974794], C: [0.0684043, 0.1162414, 9.896161]}
    unit: "1"
    basis: measured
    source: malitson1965
    analog_of: fused-silica
    locator: "refractiveindex.info SiO2/nk/Malitson.yml: formula 1 coefficients (bulk fused silica)"
    accessed: 2026-11-06
    uncertainty: {na: "film-to-bulk index difference not quantified from a source"}
    conditions: {T: "20 degC", text: "bulk fused silica used as the thermal-oxide index"}
    n_medium: air
    n_medium_note: "Leviton and Frey 2006 (arXiv p.3): Malitson measured by minimum deviation in air and his law is 'for synthetic fused silica in air'; library converts to vacuum wavelength and n relative to vacuum with air.n (Ciddor 1996 standard air)"
    valid: {T: {unit: degC, range: [20, 20]}, note: "Malitson room-temperature data (database: 20 C); use dndT for other T"}
    alternatives: []
  dndT:
    fit:
      formula: leviton-frey-sellmeier-dndT
      vars: [{name: lambda, unit: um, range: [0.4, 2.6]}, {name: T, unit: K, range: [30, 300]}]
      coeffs:
        S1: [1.10127, -4.94251e-5, 5.27414e-7, -1.59700e-9, 1.75949e-12]
        S2: [1.78752e-5, 4.76391e-5, -4.49019e-7, 1.44546e-9, -1.57223e-12]
        S3: [7.93552e-1, -1.27815e-3, 1.84595e-5, -9.20275e-8, 1.48829e-10]
        L1: [-8.90600e-2, 9.08730e-6, -6.53638e-8, 7.77072e-11, 6.84605e-14]
        L2: [2.97562e-1, -8.59578e-4, 6.59069e-6, -1.09482e-8, 7.85145e-13]
        L3: [9.34454, -7.09788e-3, 1.01968e-4, -5.07660e-7, 8.21348e-10]
        h: 0.01
    unit: 1/K
    basis: derived
    source: leviton2006
    analog_of: fused-silica
    locator: "arXiv p.6 Table 3 Sellmeier model (same coefficients as the n alternative leviton_frey_corning7980), differentiated in T"
    accessed: 2026-11-06
    derivation: "dn/dT = [n(T + h) - n(T - h)] / (2 h), h = 0.01 K, of the Table 3 model (formula leviton-frey-sellmeier-dndT; changing h to 0.1 K changes the result by < 1e-15 /K at 1.55 um, 295 K)"
    uncertainty: {abs: 6.8e-7, unit: 1/K, note: "spread between the two routes of the source, computed by L10 at 295 K over the 16 Table 6 wavelengths: Table 6 (per-wavelength quadratic n(T) fits, dn/dT = 2aT + b, p.6) minus this Sellmeier derivative is +0.9e-7 .. +3.2e-7 /K for 0.4-2.0 um and down to -6.8e-7 /K at 2.6 um; the abstract's +-2e-8 /K is only the statistical variation within one route"}
    conditions: {text: "Corning 7980, bulk value used for the film"}
    n_medium: vacuum
    n_medium_note: "absolute index (relative to vacuum, vacuum wavelength): CHARMS measures in vacuum and Leviton and Frey adjust Malitson's air-based law to vacuum for comparison (arXiv p.3)"
    alternatives:
      - id: table6_295k
        use: "the source's Table 6 values at 295 K, only at the tabulated wavelengths (scattered, not interpolated)"
        table:
          x: lambda
          x_unit: um
          xs: [0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.2, 1.5, 1.6, 1.8, 2.0, 2.2, 2.4, 2.5, 2.6]
          ys: [9.70e-6, 9.12e-6, 8.86e-6, 8.69e-6, 8.60e-6, 8.52e-6, 8.48e-6, 8.40e-6, 8.45e-6, 8.29e-6, 8.38e-6, 8.48e-6, 8.11e-6, 8.38e-6, 8.71e-6, 8.48e-6]
          interp: nodes
        unit: 1/K
        basis: derived
        source: leviton2006
        locator: "arXiv p.7 Table 6 'thermo-optic coefficient, dn/dT ... in units of 1/K', column 295 K"
        accessed: 2026-11-06
        derivation: "source p.6: dn(T)/dT = 2aT + b of quadratic n(T) fits per wavelength"
        uncertainty: {abs: 6.8e-7, unit: 1/K, note: "same two-route spread as the default; the column is non-monotonic in wavelength"}
        conditions: {T: "295 K"}
        valid: {T: {unit: K, range: [295, 295]}}
        n_medium: vacuum
        n_medium_note: "absolute index (arXiv p.3)"
