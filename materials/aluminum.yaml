# Pure aluminum for heaters, pads and plasmonics (lane T4, DevLog-041). Handbook values from the NIST solder
# database (each table names its compiled source), recommended k(T) of Ho-Powell-Liley 1972 (transcribed from the
# advanced-packaging-atlas data file), optical constants of evaporated films (Rakic 1995; McPeak 2015 alternative).
schema: amp-material/0
id: aluminum
name: Aluminum, pure
class: metal
description: >-
  Pure (99.99 % class) aluminum. Bulk handbook density, heat capacity, expansion, elastic moduli, resistivity and TCR;
  evaluated recommended thermal conductivity; complex refractive index of evaporated films (thin-film electrical and
  thermal values differ from bulk and are not stored).
verified_on: 2026-11-18
sources:
