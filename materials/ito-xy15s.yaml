# Indium tin oxide film on glass (lane T4, DevLog-041): one named commercial deposition (Xinyan XY15S ITO-glass, 110 nm)
# with optical constants and resistivity from the same paper (Minenkov et al. 2024, open access).
schema: amp-material/0
id: ito-xy15s
name: Indium tin oxide film (Xinyan XY15S ITO-glass, 110 nm)
class: dielectric_film
description: >-
  Commercial ITO-on-glass (Xinyan Technology XY15S, 110 +- 1 nm). Complex refractive index 0.40-1.69 um from
  variable-angle ellipsometry with a Drude term (free-carrier, epsilon-near-zero near 1.2 um for this film); resistivity
  by 4-wire sensing and from the ellipsometric Drude fit. ITO properties depend strongly on deposition and anneal.
verified_on: 2026-11-18
sources:
  minenkov2024:
    citation: "A. Minenkov, S. Hollweger, J. Duchoslav, O. Erdene-Ochir, M. Weise, E. Ermilova, A. Hertwig, M. Schiek, Monitoring the electrochemical failure of indium tin oxide electrodes via operando ellipsometry complemented by electron microscopy and spectroscopy, ACS Appl. Mater. Interfaces 16, 9517-9531 (2024)"
    doi: 10.1021/acsami.3c17923
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10895603/
    access: open
    read: "PMC full text (HTML) read 2026-11-18: Table 1 (thickness, 4-wire sheet resistance and resistivity, ellipsometric resistivity) with footnote I (XY15S, Xinyan Technology), and the text on the optical model (Tauc-Lorentz + Gaussian oscillators + Drude term + roughness layer; its Subsection 4.2 not read). n, k table from the refractiveindex.info entry (CC0) In2O3-SnO2/nk/Minenkov-glass.yml (sha256 2861e8774e0d..., 706 rows 0.19146-1.68869 um, 'Numerical data kindly provided by Manuela Schiek', comment '110 nm thick ITO layer on glass type XY15S purchased from Xinyan Technology LTD.'); rows at >= 0.05 um spacing from 0.40 to 1.685 um transcribed"
    licence: "article open access (PMC); refractiveindex.info database: CC0 1.0"
