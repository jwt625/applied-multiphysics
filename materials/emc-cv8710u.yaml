# not guaranteed values. alpha (default) = CTE-1 below Tg; alternative above_tg = CTE-2.
schema: amp-material/0
id: emc-cv8710u
name: Epoxy molding compound, Panasonic CV8710U
class: polymer
description: >-
  Fused-silica-filled (88.5 wt %, spherical, max 20 um) epoxy molding compound. Flexural modulus at 25 C and 260 C,
  CTE below / above Tg (TMA), Tg 160 C (TMA), specific gravity, thermal conductivity (hot wire, 25 C), dielectric
  constant and dissipation factor at 1 MHz.
