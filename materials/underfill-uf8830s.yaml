# Capillary underfill, one named product (lane T4, DevLog-041): Henkel LOCTITE ECCOBOND UF 8830S technical data sheet.
# Typical values from the vendor TDS (not specification limits). Values not on the TDS are N/A; nothing is averaged
# across vendors. Cure per TDS: 30 min ramp 25 -> 150 C, hold 2 h at 150 C.
schema: amp-material/0
id: underfill-uf8830s
name: Capillary underfill, Henkel LOCTITE ECCOBOND UF 8830S
class: polymer
description: >-
  Silica-filled epoxy capillary underfill for flip-chip BGA (TDS: high Tg, low CTE, 260 C reflow capability). Cured
  storage modulus at 25 C, CTE below and above Tg, Tg by TMA and DMA. alpha (default) = below Tg; alternative
  above_tg = above Tg. Viscoelastic data, Poisson ratio, k and density of the cured material are not on the TDS.
verified_on: 2026-11-18
sources:
  henkel_uf8830s:
    citation: "Henkel, Technical Data Sheet LOCTITE ECCOBOND UF 8830S, January-2017 (PDF digitally signed by tdx.henkel.com 2025-11-28)"
    url: https://datasheets.tdx.henkel.com/LOCTITE-ECCOBOND-UF-8830S-en_GL.pdf
    access: vendor_open
    read: "text layer p.1-2 of the PDF fetched 2026-11-18 (sha256 e3b67a50cd763228..., 2 pages; PDF not kept): Typical properties of cured material (CTE by TMA below / above Tg, Tg by TMA and DMA, storage modulus by DMA at 25 C), typical properties of uncured material, cure schedule"
  henkel_lt8234:
    citation: "Henkel, LOCTITE ECCOBOND UF 8830S product information sheet 'Semiconductor-level underfill for fine-pitch flip-chip devices', 160826/LT-8234 (6/19) US, (c) 2019 Henkel Corporation"
    url: https://dm.henkel-dam.com/is/content/henkel/lt-8234-Product_information_sheet-loctite-eccobond-uf-8830s
    access: vendor_open
    read: "text layer p.1-2 of the PDF fetched 2026-11-18 (sha256 2f351fadff75f497..., 2 pages, PDF creation date 2019-10-22; PDF not kept): table 'Thermal Properties' (Tg by TMA 118 C, CTE1 25, CTE2 100 ppm, DMA 3-point bend modulus 11,496 MPa at 25 C and 352 MPa at 250 C, tan delta peak 127 C); no thermal conductivity on the sheet"
  krayden_uf8830s:
    citation: "Krayden (distributor; former CAPLINQ product page, which redirects there), product page 'Loctite Eccobond UF8830S | Semiconductor capillary underfill that achieves MSL 3/2A', Technical Specifications section"
    url: https://www.krayden.com/products/eccobond-uf8830s
    access: open
    read: "raw HTML fetched 2026-11-18 (sha256 af43a61ad231b7c4..., page not kept; https://www.caplinq.com/loctite-eccobond-uf8830s-semiconductor-capillary-underfill-that-achieves-msl-3/2a-uf8830s.html returns HTTP 301 to this page): Technical Specifications rows Pot Life 24 hours, Specific Gravity 1.6, Tg 118 C, Thermal Conductivity '0.6 W/m.K', Thixotropic index 0.85, Viscosity 22,120 mPa.s; no test method, temperature or source document stated for any row. DISTRIBUTOR listing, not a Henkel document"
properties:
  E:
    value: 11500
    unit: MPa
    basis: datasheet
    source: henkel_uf8830s
    locator: "p.1 Typical properties of cured material: Storage Modulus, DMA, @ 25 C 11,500 N/mm2 (1,667,934 psi)"
    accessed: 2026-11-18
    uncertainty: {na: "not stated"}
    conditions: {T: "25 degC", text: "DMA storage modulus (frequency not stated), cured per the TDS schedule; used as the elastic modulus"}
    valid: {T: {unit: degC, range: [25, 25]}, note: "single temperature on the TDS; the modulus drops above Tg (see alternative dma_250c)"}
    alternatives:
      - id: dma_250c
        use: "modulus well above Tg (rubbery plateau), e.g. reflow-temperature sensitivity"
        value: 352
        unit: MPa
        basis: datasheet
        source: henkel_lt8234
        locator: "p.2 table 'Thermal Properties', row 'DMA: 3 - Point Bent', condition 250 C, column LOCTITE ECCOBOND UF 8830S: 352 MPa"
        accessed: 2026-11-18
        uncertainty: {na: "not stated"}
        conditions: {T: "250 degC", text: "DMA 3-point bending (frequency not stated); the same sheet gives 11,496 MPa at 25 C (TDS: 11,500)"}
        valid: {T: {unit: degC, range: [250, 250]}}
  alpha:
    value: 25
    unit: ppm/K
    cte_kind: unstated
    basis: datasheet
    source: henkel_uf8830s
    locator: "p.1 Coefficient of Thermal Expansion, TMA, ppm/C: Below Tg 25"
    accessed: 2026-11-18
    uncertainty: {na: "not stated"}
    conditions: {text: "TMA, below Tg (Tg by TMA 118 C)"}
    valid: {T: {unit: degC, range: [25, 118]}, note: "upper edge = Tg by TMA (TDS); the TDS states no lower edge: 25 C (the TDS reference temperature of the modulus) is used as the lower edge, an assumption"}
    alternatives: 
      - id: above_tg
        use: "CTE above Tg (alpha2)"
        value: 100
        unit: ppm/K
        cte_kind: unstated
        basis: datasheet
        source: henkel_uf8830s
        locator: "p.1 Coefficient of Thermal Expansion, TMA, ppm/C: Above Tg 100"
        accessed: 2026-11-18
        uncertainty: {na: "not stated"}
        conditions: {text: "TMA, above Tg (118 C by TMA)"}
        valid: {T: {na: "above Tg (TMA 118 C); upper limit not stated on the TDS"}}
  Tg:
    value: 118
    unit: degC
    basis: datasheet
    source: henkel_uf8830s
    locator: "p.1 Glass Transition Temperature (Tg), C: By TMA 118; By DMA 126.5"
    accessed: 2026-11-18
    uncertainty: {na: "not stated"}
    conditions: {text: "by TMA (the method of the CTE breakpoint)"}
    valid: {T: {na: "a transition temperature, not a function of T"}}
    alternatives: 
      - id: dma
        use: "Tg by DMA"
        value: 126.5
        unit: degC
        basis: datasheet
        source: henkel_uf8830s
        locator: "p.1 Glass Transition Temperature (Tg), C: By DMA 126.5"
        accessed: 2026-11-18
        uncertainty: {na: "not stated"}
        conditions: {text: "by DMA"}
        valid: {T: {na: "a transition temperature"}}
  nu:
    value: N/A
    unit: "1"
    missing: "Poisson ratio not on the UF 8830S TDS"
    alternatives: []
  k:
    value: N/A
    unit: W/(m*K)
    missing: "thermal conductivity in no Henkel document read. Checked 2026-11-18: TDS January 2017 and product information sheet LT-8234 (6/19) (both read earlier on 2026-11-18, no k); Henkel brochure LT-6885 (10/25) 'High-Performance Materials for Telecom and Datacom Optoelectronics' (sha256 566b4a1cceee32e6..., pdf p.21 and p.39 underfill tables list viscosity, CTE alpha1 / alpha2, Tg, pot life only); Henkel product pages henkel-adhesives.com (301 to next.henkel-adhesives.com, then HTTP 404). Only a distributor listing gives a value (alternative distributor_listing, read 2026-11-18); sims that need k use a labelled override or that alternative"
    alternatives:
      - id: distributor_listing
        use: "DISTRIBUTOR listing (Krayden, ex-CAPLINQ page), not a manufacturer document; no test method or temperature; use only as a labelled placeholder"
        value: 0.6
        unit: W/(m*K)
        basis: datasheet
        source: krayden_uf8830s
        locator: "product page, Technical Specifications > Thermal Properties > Thermal Conductivity: '0.6 W/m.K'"
        accessed: 2026-11-18
        uncertainty: {na: "not stated; one significant digit as listed"}
        conditions: {text: "cured state, method and temperature not stated by the distributor; not traceable to a Henkel document read here"}
        valid: {T: {na: "temperature not stated"}}
  rho:
    value: N/A
    unit: kg/m^3
    missing: "cured density not on the TDS (the TDS lists specific gravity 1.6 at 25 C for the UNCURED material only)"
    alternatives: []
missing:
  - {what: "E above Tg, viscoelastic (Prony / shift) data, cure shrinkage: not on the TDS"}
