# Tantalum film, sputtered (lane G1 sourcing, DevLog-041 s.4.3 follow-up). Each leaf names its film (deposition,
# thickness, phase). Default leaves describe as-deposited room-temperature magnetron-sputtered Ta without a seed layer
# (beta-Ta-rich); alpha-Ta films (on a TaN or TiN seed, or deposited at 600 C) and bulk Ta are alternatives.
schema: amp-material/0
id: tantalum-film
name: Tantalum film (magnetron sputtered)
class: metal
description: >-
  Sputtered Ta thin film (diffusion barrier, resistor, superconducting-circuit layer). The phase depends on deposition:
  room-temperature sputtering on Si or oxide gives metastable tetragonal beta-Ta (high resistivity); a TaN or TiN seed
  or a heated substrate gives bcc alpha-Ta. Defaults: electrical resistivity of a 200 nm film sputtered on unheated
  Si (beta-dominated by XRD) and thermal conductivity of a 170 nm film sputtered at room temperature on fused silica
  (tentatively beta-rich). Bulk annealed Ta k (HPL 1972) is an alternative labelled bulk.
verified_on: 2026-11-18
sources:
  singer2024:
    citation: "M. Singer, B. Schoof, H. Gupta, D. Zahn, J. Weber, M. Tornow, Tantalum thin films sputtered on silicon and on different seed layers: material characterization and coplanar waveguide resonator performance, IEEE International Conference on Quantum Computing and Engineering (QCE) 2024; arXiv:2409.06041v1"
    doi: 10.1109/QCE60285.2024.00141
    url: https://arxiv.org/abs/2409.06041
    access: open
    read: "text layer of the arXiv v1 PDF fetched 2026-11-18 (sha256 14e235df1c0be700..., 6 pages; PDF not kept): Sec. II.A deposition (RF magnetron, Alcatel A450, about 7 cm target-to-chip, 20 sccm Ar, 18 ubar, 200 W; Ta about 200 nm; seed layers 5-6 nm with 2 sccm N2 added), Sec. II.B four-point Hall-bar resistivity, Sec. III.A GI-XRD phase assignment, Sec. III.B resistivity values; DOI of the IEEE version from the arXiv abstract page"
  deng2026:
    citation: "Z. Deng, J. Ma, P. Jiang, Experimental assessment of the Wiedemann-Franz law in thin metal films using thermoreflectance and electrical measurements, J. Appl. Phys. 140, 115101 (2026); arXiv:2609.17990"
    doi: 10.1063/5.0341686
    url: https://arxiv.org/abs/2609.17990
    access: open
    read: "text layer of the arXiv PDF fetched 2026-11-18 (sha256 532c1ae8250f36bd..., 24 pages, author accepted manuscript; PDF not kept): Sec. II.B and Table 1 (deposition, thickness), phase discussion (beta-Ta-rich, not XRD-confirmed), Sec. III.A Ta film fit (k_m, C_m), anisotropic-fit check; the film resistivity appears only in figures (not read as numbers); journal reference and DOI from the arXiv abstract page, accessed 2026-11-18 (values read from the accepted manuscript, not the journal version)"
  nie2001:
    citation: "H. B. Nie, S. Y. Xu, S. J. Wang, L. P. You, Z. Yang, C. K. Ong, J. Li, T. Y. F. Liew, Structural and electrical properties of tantalum nitride thin films fabricated by using reactive radio-frequency magnetron sputtering, Appl. Phys. A 73(2), 229-236 (2001); arXiv:cond-mat/0305683v2"
    url: https://arxiv.org/abs/cond-mat/0305683
    access: open
    read: "text layer of the arXiv v2 PDF fetched 2026-11-18 (sha256 0e896bc27ffd7751..., 10 pages; PDF not kept): Sec. 2 deposition, Sec. 3.5 resistivity, Table 1 (thickness, resistivity vs N2 partial pressure); journal reference from the arXiv abstract page"
  hpl1972:
    citation: "C. Y. Ho, R. W. Powell, P. E. Liley, Thermal conductivity of the elements, J. Phys. Chem. Ref. Data 1, 279-421 (1972)"
    doi: 10.1063/1.3253100
    url: https://srd.nist.gov/jpcrdreprint/1.3253100.pdf
    access: open
    read: "PDF fetched 2026-11-18 (sha256 84a8af6036cff51a..., 144 pages, scanned; PDF not kept); 400 dpi page render of journal p.399 (pdf p.122) 'Thermal conductivity of tantalum': recommended-value table (solid) and REMARKS"
