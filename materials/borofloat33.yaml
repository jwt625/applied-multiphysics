# Borosilicate float glass, one named product (lane T4, DevLog-041): SCHOTT BOROFLOAT 33 technical data sheet. Used as a
# glass-core / interposer substrate analog and for MEMS / optics; it is not the alkali-free glass of commercial glass-core
# substrates (AGC EN-A1 data sheet not reachable, APA R4).
schema: amp-material/0
id: borofloat33
name: Borosilicate glass, SCHOTT BOROFLOAT 33
class: glass
description: >-
  SCHOTT BOROFLOAT 33 floated borosilicate glass: density, Young's modulus, Poisson ratio, mean CTE 20-300 C,
  transformation temperature, thermal conductivity (90 C), specific heat (20-100 C), permittivity and loss tangent at
  1 MHz, refractive index nd.
verified_on: 2026-11-18
sources:
  schott_b33:
    citation: "SCHOTT Technical Glass Solutions GmbH, BOROFLOAT 33 - Technical Data (PDF created 2019-03-21), hosted by Edmund Optics"
    url: https://www.edmundoptics.com/ViewDocument/schott-borofloat-technical-data-sheet-english.pdf
    access: vendor_open
    read: "text layer of the 1-page PDF fetched 2026-11-18 (sha256 52591e4aaf8bb75a...; PDF not kept): Thermal, Mechanical, Electrical and Optical properties columns (the left optical-index table column is garbled in the text layer and not used). The the advanced-packaging-atlas project read an earlier file of the same sheet (2014-11-04); the values used here agree with the APA record"
