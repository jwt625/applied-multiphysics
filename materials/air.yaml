# Dry air at 0.101325 MPa (lane L10, DevLog-013). Density, heat capacity and speed of sound from the Lemmon et al.
# 2000 reference equation of state (Table A2, converted per unit mass by packages/materials/scripts/derive-air.ts);
# viscosity and thermal conductivity from the Kadoya et al. 1985 correlation (tables at 0.10 MPa).
schema: amp-material/0
id: air
name: Air, dry, at 1 atm
class: gas
description: >-
  Standard dry air (N2 / O2 / Ar pseudo-pure fluid) along the 0.101325 MPa isobar, 200-600 K (transport 200-650 K).
  Values are for this pressure only; other pressures need the source equations.
verified_on: 2026-11-06
sources:
  lemmon2000:
    citation: "E. W. Lemmon, R. T Jacobsen, S. G. Penoncello, D. G. Friend, Thermodynamic properties of air and mixtures of nitrogen, argon, and oxygen from 60 to 2000 K at pressures to 2000 MPa, J. Phys. Chem. Ref. Data 29(3), 331-385 (2000)"
    doi: 10.1063/1.1285884
    url: https://srd.nist.gov/jpcrdreprint/1.1285884.pdf
    access: open
    read: "text layer: abstract (uncertainties), p.334 (constants, molar mass), p.366-367 Table A2 0.101325 MPa isobar; read by L10 2026-11-06; cached under cache/materials/air/"
  ciddor1996:
    citation: "P. E. Ciddor, Refractive index of air: new equations for the visible and near infrared, Appl. Opt. 35, 1566-1573 (1996); standard-air dispersion as tabulated by refractiveindex.info other/mixed gases/air/nk/Ciddor.yml"
    doi: 10.1364/AO.35.001566
    url: https://github.com/polyanskiy/refractiveindex.info-database/blob/main/database/data/other/mixed%20gases/air/nk/Ciddor.yml
    access: paywalled
    read: "primary not read; refractiveindex.info entry (CC0) fetched and read by L10 2026-11-06: formula 6, coefficients 0 0.05792105 238.0185 0.00167917 57.362, 0.23-1.690 um, standard air (dry, 15 C, 101.325 kPa, 450 ppm CO2)"
    licence: "refractiveindex.info database: CC0 1.0"
  mathar2007:
    citation: "R. J. Mathar, Refractive index of humid air in the infrared: model fits, J. Opt. A: Pure Appl. Opt. 9, 470-476 (2007); dry-air table at 15 C, 101.325 kPa, 370 ppm CO2 as computed by refractiveindex.info other/mixed gases/air/nk/Mathar-1.3.yml"
    doi: 10.1088/1464-4258/9/5/008
    url: "https://github.com/polyanskiy/refractiveindex.info-database/blob/main/database/data/other/mixed%20gases/air/nk/Mathar-1.3.yml"
    access: open
    read: "primary not read (its access not checked); tabulated values of the open database entry (CC0) fetched 2026-11-07 by lane MX"
    licence: "refractiveindex.info database: CC0 1.0"
  kadoya1985:
    citation: "K. Kadoya, N. Matsunaga, A. Nagashima, Viscosity and thermal conductivity of dry air in the gaseous phase, J. Phys. Chem. Ref. Data 14(4), 947-970 (1985)"
    doi: 10.1063/1.555744
    url: https://srd.nist.gov/jpcrdreprint/1.555744.pdf
    access: open
    read: "150 dpi page renders of p.954 (Table 8) and p.962 (Table 12), row 0.10 MPa (the text layer is OCR and garbled); read by L10 2026-11-06"
