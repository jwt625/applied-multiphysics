    unit: "1"
    basis: reference_correlation
    source: ciddor1996
    locator: "refractiveindex.info Ciddor.yml: formula 6, n - 1 = 0.05792105 / (238.0185 - lambda^-2) + 0.00167917 / (57.362 - lambda^-2), lambda in um"
