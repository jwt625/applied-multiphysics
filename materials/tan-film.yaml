# Tantalum nitride film, reactively sputtered (lane G1 sourcing, DevLog-041 s.4.3 follow-up). Ta-N film properties
# depend strongly on the N2 fraction (phase: bcc Ta(N), hexagonal Ta2N, fcc TaN, N-rich phases). Each leaf names its
# film; resistivity and thermal conductivity come from DIFFERENT films (different groups and N2 fractions).
schema: amp-material/0
id: tan-film
name: Tantalum nitride film (reactive sputtered)
class: ceramic
description: >-
  Reactively sputtered Ta-N thin film (diffusion barrier, thin-film resistor, seed layer). Resistivity from a series of
  RF-sputtered films (Nie et al. 2001) versus N2 partial pressure; default = the 7.5 % N2 film, where the source first
  reports fcc TaN. Thermal conductivity from a 330 nm RF reactive-sputtered film dominated by the Ta2N phase (Zhang et
  al. 2025, TDTR), a different deposition from the resistivity default.
verified_on: 2026-11-18
sources:
  nie2001:
    citation: "H. B. Nie, S. Y. Xu, S. J. Wang, L. P. You, Z. Yang, C. K. Ong, J. Li, T. Y. F. Liew, Structural and electrical properties of tantalum nitride thin films fabricated by using reactive radio-frequency magnetron sputtering, Appl. Phys. A 73(2), 229-236 (2001); arXiv:cond-mat/0305683v2"
    url: https://arxiv.org/abs/cond-mat/0305683
    access: open
    read: "text layer of the arXiv v2 PDF fetched 2026-11-18 (sha256 0e896bc27ffd7751..., 10 pages; PDF not kept): abstract, Sec. 2 deposition, Sec. 3.1 thickness, Sec. 3.5 resistivity, Sec. 4 conclusion (phase sequence), Table 1 (thickness, lattice constant, resistivity vs N2 partial pressure); journal reference from the arXiv abstract page"
  zhang2025:
    citation: "M. Zhang, T. Chen, A. Zeng, J. Tang, R. Guo, P. Jiang, Simultaneous measurement of thermal conductivity, heat capacity, and interfacial thermal conductance by leveraging negative delay-time data in time-domain thermoreflectance, Prog. Nat. Sci.: Mater. Int. 35, 375-384 (2025); arXiv:2411.15767"
    doi: 10.1016/j.pnsc.2025.02.001
    url: https://arxiv.org/abs/2411.15767
    access: open
    read: "text layer of the arXiv PDF fetched 2026-11-18 (sha256 c71d1d5226c4566f..., PDF not kept): Sec. 3.2 TaN film (deposition, thickness, fitted k, C, G at room temperature), Table I (measured vs literature k, C); journal reference from the arXiv abstract page"
