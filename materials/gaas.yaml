schema: amp-material/0
id: gaas
name: Gallium arsenide (GaAs)
class: semiconductor
description: >-
  Undoped GaAs. Refractive index from the Skauli 2003 dispersion relation (22 C). Density, Young's modulus and Poisson's
  ratio are the isotropic approximation Baker et al. 2014 used for disk resonators (paper model inputs, not a measurement
  read here); the cubic stiffness tensor is not authored.
