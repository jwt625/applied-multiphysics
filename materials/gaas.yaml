# Gallium arsenide (lane MX, DevLog-035 s.11, 2026-11-07; requested by lane MOM, DevLog-034 R-MX1). Optical dispersion
# from Skauli et al. 2003; isotropic mechanics as used by Baker et al. 2014 (their model inputs). Photoelastic constants
