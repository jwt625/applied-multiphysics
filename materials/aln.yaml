# Aluminum nitride, wurtzite single crystal (lane T4, DevLog-041): ordinary and extraordinary Sellmeier dispersion of
# Pastrnak-Roskovcova 1966. Sputtered AlN films (piezo MEMS, photonics) differ; mechanics and thermal data not read here.
schema: amp-material/0
id: aln
name: Aluminum nitride (AlN), wurtzite crystal
class: crystal
description: >-
  Wurtzite AlN, uniaxial (c axis = frame z): n_o, n_e from single-crystal measurements (Sellmeier fits, 0.22-5 um).
  Film properties depend on deposition (sputtered c-axis-oriented films); stiffness, piezoelectric and thermal data not
  authored.
