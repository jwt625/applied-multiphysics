    access: open
    read: "not re-read; values transcribed from the advanced-packaging-atlas data file, which read the p.370 recommended-value table on 2026-10-20"
    via: "advanced-packaging-atlas engine/data/materials/metals.yaml at fe39985 (ni.properties.k)"
