# Nickel, bulk (lane T4, DevLog-041), for UBM, barrier and lid plating. Handbook values from the NIST solder database
# compilation; recommended k(T) of Ho-Powell-Liley 1972 and Poisson ratio of Ledbetter-Reed 1973 (both transcribed from
# the advanced-packaging-atlas data file). Electroplated / electroless Ni (Ni-P) differs from bulk and is not stored.
schema: amp-material/0
id: nickel
name: Nickel, bulk
class: metal
description: >-
  Bulk nickel: handbook density, heat capacity, expansion, resistivity, TCR and Young's modulus; evaluated k(T) and
  Poisson ratio. Ferromagnetic: mu_r is field dependent and not stored.
verified_on: 2026-11-18
sources:
  nist_solder_db_v4:
    citation: "T. Siewert, S. Liu, D. R. Smith, J. C. Madeni, Database for solder properties with emphasis on new lead-free solders, release 4.0, NIST and Colorado School of Mines (2002-02-11)"
    url: https://www.msed.nist.gov/solder/NIST_LeadfreeSolder_v4.pdf
    access: open
    read: "text layer of the local copy (cache/materials/gold/solderdb.txt, fetched 2026-11-06), Tables 1.10, 2.2.5, 2.2.7, 2.2.8 re-read 2026-11-18; a compilation: each table names its source (Lange 1956, AIP Handbook 1957, Smithells 1983, ASM Handbook Vol. 6 1993)"
  hpl1972:
    citation: "C. Y. Ho, R. W. Powell, P. E. Liley, Thermal conductivity of the elements, J. Phys. Chem. Ref. Data 1, 279-421 (1972)"
    doi: 10.1063/1.3253100
