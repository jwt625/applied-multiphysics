# Tungsten, bulk handbook values and optical constants (lane T4, DevLog-041), for heaters and vias. Thin-film W
# (sputtered / CVD) resistivity and stress differ from bulk and are not stored.
schema: amp-material/0
id: tungsten
name: Tungsten, bulk
class: metal
description: >-
  Bulk tungsten: handbook density, heat capacity, expansion, resistivity, TCR, thermal conductivity and elastic moduli
  (NIST solder database compilation), optical constants from Ordal et al. 1988. Thin-film values are not stored.
verified_on: 2026-11-18
sources:
  nist_solder_db_v4:
    citation: "T. Siewert, S. Liu, D. R. Smith, J. C. Madeni, Database for solder properties with emphasis on new lead-free solders, release 4.0, NIST and Colorado School of Mines (2002-02-11)"
    url: https://www.msed.nist.gov/solder/NIST_LeadfreeSolder_v4.pdf
    access: open
    read: "text layer of the local copy (cache/materials/gold/solderdb.txt, fetched 2026-11-06), Tables 1.10, 2.2.5, 2.2.7, 2.2.8 re-read 2026-11-18; a compilation: each table names its source (Lange 1956, AIP Handbook 1957, Smithells 1983, ASM Handbook Vol. 6 1993)"
  ordal1988:
    citation: "M. A. Ordal, R. J. Bell, R. W. Alexander, L. A. Newquist, M. R. Querry, Optical properties of Al, Fe, Ti, Ta, W, and Mo at submillimeter wavelengths, Appl. Opt. 27(6), 1203-1209 (1988)"
    doi: 10.1364/AO.27.001203
    url: https://github.com/polyanskiy/refractiveindex.info-database/blob/main/database/data/main/W/nk/Ordal.yml
    access: paywalled
    read: "primary not read; n, k table from the refractiveindex.info entry (CC0) W/nk/Ordal.yml fetched 2026-11-18 (sha256 9c69e415a8b0...), 51 rows 0.667-200 um; all 22 rows 0.667-2.86 um transcribed. The entry gives no sample or temperature comment"
    licence: "refractiveindex.info database: CC0 1.0"
