    doi: 10.1109/TCPMT.2025.3614186
    access: paywalled
    read: "not re-read (its Table III is an image in the advanced-packaging-atlas text extract); values transcribed from the advanced-packaging-atlas data file, which read the p.7 Table III page render on 2026-10-20 (row 13 SAC 305 Solder: E -50 C 52.5 GPa, 220 C 33.6 GPa, nu 0.29, CTE 2.05e-5 / 2.50e-5 /C; the paper cites Zhang et al., Microelectron. Reliab. 54, 281 (2014), which prints Anand parameters only, so the primary of this elastic / CTE set is not identified)"
    via: "advanced-packaging-atlas engine/data/materials/solders.yaml at fe39985 (sac305.properties.elastic, .cte)"
