# SAC305 solder (Sn-3.0Ag-0.5Cu), lane T4 (DevLog-041). Physical data from the Indium Corporation Indalloy 256 product data
# sheet; default elastic modulus E(T) and CTE(T) from a peer-reviewed package model (TCPMT 2025, transcribed from the
# advanced-packaging-atlas data file) because the data-sheet Young's modulus (6.9 GPa) is a quasi-static tensile value
# far below the moduli used in package mechanics (kept as an alternative). Viscoplastic (Anand) data: not stored here.
schema: amp-material/0
id: sac305
name: SAC305 solder (Sn-3.0Ag-0.5Cu)
class: metal
description: >-
  Lead-free solder for C4 bumps and BGA balls. Solidus 217 C, liquidus 220 C (data sheet). Elastic-only data: creep
  and plasticity (Anand) are not represented by this library.
verified_on: 2026-11-18
sources:
  indium_pds_100346:
    citation: "Indium Corporation, Product Data Sheet Indalloy 256 (SAC305) for Preforms, Form No. 100346 R0 (c)2024"
    url: https://www.indium.com/wp-content/uploads/2025/03/Indalloy256-for-Preforms-PDS-100346-R0-1.pdf
    access: vendor_open
    read: "text layer of the 1-page PDF fetched 2026-11-18 (sha256 a376690b5546eb85..., created 2024-12-09; PDF not kept): Indalloy 256 Properties table (liquidus, solidus, density, thermal conductivity, CTE, electrical resistivity, Young's modulus, Poisson's ratio, strengths, elongation)"
  tcpmt2025_3614186:
