<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>amp rt</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0d0f12; --panel: #14171b; --panel2: #1a1e23; --line: #272c33; --text: #cdd1d6; --dim: #7c838d;
    --acc: #4ea1ff; --warn: #e0a84a; --bad: #e06a5a; --ok: #6cc28a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 12px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: 30px 1fr 22px; grid-template-columns: 272px 1fr; grid-template-areas: "top top" "side main" "foot foot"; overflow: hidden; }
  #top { grid-area: top; display: flex; align-items: stretch; gap: 0; background: var(--panel); border-bottom: 1px solid var(--line); }
  #top .brand { padding: 0 12px; display: flex; align-items: center; color: var(--dim); font-family: var(--mono); border-right: 1px solid var(--line); }
  .tab { border: 0; border-right: 1px solid var(--line); border-radius: 0; background: transparent; color: var(--dim); padding: 0 14px; font: inherit; cursor: pointer; }
  .tab.on { color: var(--text); background: var(--panel2); box-shadow: inset 0 -2px 0 var(--acc); }
  .btn { border: 1px solid var(--line); border-radius: 0; background: var(--panel2); color: var(--text); font: inherit; padding: 2px 10px; cursor: pointer; }
  .btn:hover { border-color: #3a414b; }
  .btn.primary { border-color: var(--acc); color: #fff; }
  #top .ctl { display: flex; align-items: center; gap: 6px; padding: 0 10px; border-right: 1px solid var(--line); }
  #status { margin-left: auto; display: flex; align-items: center; gap: 14px; padding: 0 12px; font-family: var(--mono); color: var(--dim); white-space: nowrap; }
  #status b { color: var(--text); font-weight: 500; }
  .badge { border: 1px solid var(--warn); color: var(--warn); border-radius: 0; padding: 0 5px; font-family: var(--mono); font-size: 11px; }
  #side { grid-area: side; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; }
  .sec { border-bottom: 1px solid var(--line); padding: 6px 10px 8px; }
  .sec h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  .row { display: grid; grid-template-columns: 70px 1fr 62px; align-items: center; gap: 6px; margin: 3px 0; }
  .row label { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .u { grid-column: 3; }
  input[type=number], select { width: 100%; box-sizing: border-box; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 0; font: 11px var(--mono); padding: 2px 4px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; background: var(--line); border-radius: 0; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 9px; height: 13px; margin-top: -5px; background: var(--acc); border: 0; border-radius: 0; }
  input[type=range]::-moz-range-track { height: 3px; background: var(--line); border-radius: 0; }
  input[type=range]::-moz-range-thumb { width: 9px; height: 13px; background: var(--acc); border: 0; border-radius: 0; }
  .row > .grid2, .row > select { grid-column: 2 / 4; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
  .tool.on { border-color: var(--acc); color: #fff; }
  #probe { font-family: var(--mono); font-size: 10.5px; display: grid; grid-template-columns: 96px 1fr; gap: 1px 6px; }
  #probe .k { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #probe .v { color: var(--text); overflow-wrap: anywhere; }
  #main { grid-area: main; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--bg); }
  #wrap { position: relative; display: flex; align-items: stretch; gap: 10px; }
  #cv { display: block; border: 1px solid var(--line); border-radius: 0; cursor: crosshair; touch-action: none; }
  #cbar { position: relative; width: 124px; font: 11px var(--mono); color: var(--dim); }
  #cbar canvas { position: absolute; left: 0; top: 0; width: 14px; height: 100%; border: 1px solid var(--line); border-radius: 0; box-sizing: border-box; }
  #cbar > span { position: absolute; left: 20px; white-space: nowrap; }
  #cbar .clip { color: var(--warn); margin-left: 6px; }
  #cbhi { top: -2px; }
  #cbmid { top: 50%; transform: translateY(-50%); }
  #cblo { bottom: -2px; }
  #cbu { bottom: -18px; left: 0 !important; color: var(--text); }
  #hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 6px 12px; background: rgba(13,15,18,.82); border: 1px solid var(--line); border-radius: 0; color: var(--text); pointer-events: none; }
  #tip { position: fixed; pointer-events: none; padding: 3px 6px; background: rgba(20,23,27,.94); border: 1px solid var(--line); border-radius: 0; font: 11px var(--mono); color: var(--text); display: none; white-space: pre; z-index: 5; }
  #foot { grid-area: foot; display: flex; gap: 16px; align-items: center; padding: 0 10px; background: var(--panel); border-top: 1px solid var(--line); font: 11px var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; }
  #err { color: var(--bad); }
  input[type=checkbox] { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; margin: 0; border: 1px solid #3a414b; border-radius: 0; background: var(--bg); cursor: pointer; }
  input[type=checkbox]:checked { background: var(--acc); box-shadow: inset 0 0 0 2px var(--bg); }
  [title] { cursor: help; }
  button[title], select[title], input[title] { cursor: pointer; }
  /* phone layout (audit S3): one column, 16 px gutter, canvas width-limited at the exact nx:ny aspect,
     horizontal colorbar, controls folded below; the page scrolls vertically only */
  @media (max-width: 699px) {
    html, body { height: auto; overflow-x: hidden; }
    body { display: flex; flex-direction: column; overflow-y: auto; }
    #top { flex-wrap: wrap; order: 0; }
    #main { order: 1; }
    #side { order: 2; }
    #foot { order: 3; }
    #top .brand { display: none; }
    .tab { padding: 6px 12px; }
    #top .ctl { padding: 4px 16px; border-right: 0; width: 100%; box-sizing: border-box; border-top: 1px solid var(--line); }
    #status { margin-left: 0; width: 100%; box-sizing: border-box; flex-wrap: wrap; white-space: normal; gap: 4px 12px; padding: 4px 16px; border-top: 1px solid var(--line); }
    #main { display: block; padding: 12px 16px 8px; }
    #wrap { flex-direction: column; gap: 4px; }
    #cbar { width: 100%; height: 44px; }
    #cbar canvas { width: 100%; height: 14px; }
    #cbar > span { top: 16px; left: auto; }
    #cblo { left: 0 !important; bottom: auto; }
    #cbmid { left: 50% !important; transform: translateX(-50%); }
    #cbhi { right: 0; }
    #cbu { top: 30px !important; bottom: auto; left: 0 !important; }
    #hint { position: static; transform: none; margin-top: 6px; }
    #side { border-right: 0; border-top: 1px solid var(--line); overflow: visible; }
    .sec { padding: 6px 16px 8px; }
    .row { grid-template-columns: 84px 1fr 70px; }
    #foot { flex-wrap: wrap; white-space: normal; padding: 4px 16px; gap: 4px 12px; }
  }
</style>
</head>
<body>
<div id="top">
  <div class="brand" title="@amp/rt real-time WebGPU kernels (DevLog-005)">amp rt</div>
  <button class="tab" data-k="lbm" title="D2Q9 lattice Boltzmann (TRT), flow past a cylinder in the DFG 2D-2 channel">LBM</button>
  <button class="tab" data-k="fdtd" title="2D TMz FDTD with CPML: wave tank / antenna">FDTD</button>
  <button class="tab" data-k="gs" title="Gray-Scott reaction-diffusion (The Well parameters)">Gray-Scott</button>
  <div class="ctl">
    <button class="btn primary" id="run" title="Run / pause (Space)">Run</button>
    <button class="btn" id="stepb" title="Advance one frame of steps">Step</button>
    <button class="btn" id="reset" title="Re-initialize with the current parameters">Reset</button>
    <button class="btn" id="share" title="Copy a URL that holds the kernel and parameters">Link</button>
  </div>
  <div id="status"></div>
</div>
<div id="side">
  <div class="sec"><h3>Parameters</h3><div id="params"></div></div>
  <div class="sec"><h3>View</h3>
    <div class="row"><label title="Displayed quantity">field</label><select id="view"></select></div>
    <div class="row"><label title="Colorbar limits in the displayed unit">range</label><div class="grid2"><input type="number" id="lo" step="any" title="lower limit"><input type="number" id="hi" step="any" title="upper limit"></div></div>
    <div class="row"><label title="Range from the 99th percentile of |value| (readback every 15 frames)">auto range</label><input type="checkbox" id="auto"></div>
    <div class="row"><label title="Bilinear interpolation between cell centres">smooth</label><input type="checkbox" id="smooth" checked></div>
  </div>
  <div class="sec"><h3>Draw</h3>
    <div id="tools" class="grid3"></div>
    <div class="row" style="margin-top:6px"><label title="Brush radius">brush</label><input type="range" id="brush" min="0" max="20" step="1" value="3"><input type="number" id="brushn" min="0" max="20" step="1" value="3"></div>
    <div class="row" id="valrow"><label id="vallab" title="Value painted by the tool">value</label><input type="range" id="val" min="1" max="12" step="0.1" value="4"><input type="number" id="valn" min="1" max="12" step="0.1" value="4"></div>
  </div>
  <div class="sec"><h3>Presets</h3><div id="presets" class="grid2"></div></div>
  <div class="sec"><h3>Platform</h3><div id="probe">probing...</div></div>
</div>
<div id="main">
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="cbar"><canvas id="cbc" width="1" height="256"></canvas><span id="cbhi"></span><span id="cbmid"></span><span id="cblo"></span><span id="cbu"></span></div>
  </div>
  <div id="hint">Space or Run to start. Drag on the field to draw.</div>
</div>
<div id="foot"><span id="info"></span><span id="err"></span></div>
<div id="tip"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
