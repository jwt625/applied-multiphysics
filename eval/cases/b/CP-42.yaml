  - {input: "Poisson ratio and density of the isotropic Si model", assumption: "materials-package values with source (to be recorded); state them in the run record"}
  - {input: "fillet radii, cross-bar width, pad geometry", assumption: "semicircular hole ends (fillet radius = hx/2); pads as clamped ends"}
