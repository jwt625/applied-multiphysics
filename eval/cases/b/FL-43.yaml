    tolerance: {rel: 1.0e-2, note: "John 2004 p.785 emphasizes relative errors below 1 % for the pressure difference; stated deviation < 1e-4 (p.785)"}
    bounds: [-0.115, -0.105]
    basis: P
    form: benchmark
    extraction: text
    provenance: {citation: "John 2004, eq. (10)", locator: "IJNMF 44, p.785 eq. (10) (author PDF page 9)", accessed: 2026-11-06}
