    value: 2.950921575
    unit: "1"
    tolerance: {rel: 1.0e-3, note: "John 2004 p.785 emphasizes relative errors below 0.1 % for drag; his reference error is < 5e-7 (p.784)"}
    bounds: [2.93, 2.97]
    basis: P
    form: benchmark
    extraction: text
    provenance: {citation: "John 2004, eq. (8)", locator: "IJNMF 44, p.784 eq. (8) (author PDF page 8)", accessed: 2026-11-06}
  - quantity: c_L_max
