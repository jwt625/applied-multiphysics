    definition: "max over 0 <= t <= 8 of 2 F_L / (rho Ubar^2 D); John: t(c_L,max) = 5.693125 s"
    value: 0.47795
    unit: "1"
    tolerance: {rel: 1.0e-2, note: "John 2004 p.785 emphasizes relative errors below 1 % for lift; his reference interval is [0.4779, 0.4780] (p.784)"}
    bounds: [0.47, 0.49]
    basis: P
    form: benchmark
    extraction: text
    provenance: {citation: "John 2004, eq. (9)", locator: "IJNMF 44, p.784 eq. (9)", accessed: 2026-11-06}
